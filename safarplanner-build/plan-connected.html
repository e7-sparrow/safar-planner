<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan a Trip · Safar Planner</title>
<meta name="description" content="Plan a trip around your budget. Enter where, how many people and how much you can spend, and get travel, stay, food and a day-by-day itinerary on a real Google Map.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout concept: a boarding-pass journey. Navy departure band on top, warm working surface below, fares and days drawn as perforated tickets. */
:root{
  --bg:#F6F1E8;--surface:#FFFCF6;--surface2:#EFE8DA;--ink:#0E2238;--muted:#52616F;--line:#DDD3C0;
  --teal:#12808A;--teal-d:#0B5B63;--on-teal:#FFFFFF;--orange:#E4702B;--on-orange:#1B0F05;--orange-soft:#FBE6D6;
  --navy:#0E2238;--on-navy:#F6F1E8;--navy-muted:#A9B8C8;
  --ok:#17704A;--ok-bg:#DDF1E8;--warn:#7D5209;--warn-bg:#F7EBCF;--bad:#A32D20;--bad-bg:#F7DDD8;
  --shadow:0 1px 2px rgba(14,34,56,.06),0 10px 28px rgba(14,34,56,.09);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1726;--surface:#102338;--surface2:#16304A;--ink:#F1EBDD;--muted:#9FB1C3;--line:#27425D;
  --teal:#3DB7C0;--teal-d:#7CD3DA;--on-teal:#06222A;--orange:#F28C4E;--on-orange:#1B0F05;--orange-soft:#3A2619;
  --navy:#07111E;--on-navy:#F1EBDD;--navy-muted:#8FA3B8;
  --ok:#4CC38A;--ok-bg:#12372A;--warn:#E3B04B;--warn-bg:#3A3015;--bad:#F0735F;--bad-bg:#3E1D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1726;--surface:#102338;--surface2:#16304A;--ink:#F1EBDD;--muted:#9FB1C3;--line:#27425D;
  --teal:#3DB7C0;--teal-d:#7CD3DA;--on-teal:#06222A;--orange:#F28C4E;--on-orange:#1B0F05;--orange-soft:#3A2619;
  --navy:#07111E;--on-navy:#F1EBDD;--navy-muted:#8FA3B8;
  --ok:#4CC38A;--ok-bg:#12372A;--warn:#E3B04B;--warn-bg:#3A3015;--bad:#F0735F;--bad-bg:#3E1D18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body.hasbar #app{padding-bottom:168px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.08;letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
a{color:var(--teal-d);text-underline-offset:3px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:6px}
.wrap{width:min(1120px,100%);margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--f-mono)}
.stack{display:grid;gap:16px}

/* header + stepper */
.top{background:var(--navy);color:var(--on-navy)}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px}
.brand{font:700 22px var(--f-display);letter-spacing:-.02em;color:var(--on-navy);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px}
.brand i{font-style:normal;font-weight:500;color:var(--navy-muted)}
.tagline{font-size:12px;color:var(--navy-muted);letter-spacing:.08em;text-transform:uppercase}
.steps{display:flex;gap:4px;overflow-x:auto;padding-block:6px 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.st{flex:none;background:transparent;border:0;color:var(--navy-muted);padding:8px 12px;border-radius:99px;font:600 13px var(--f-body);cursor:default;display:flex;gap:8px;align-items:center;white-space:nowrap}
.st .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.st.done{color:var(--on-navy);cursor:pointer}.st.done .dot{background:var(--teal);opacity:1}
.st.on{background:var(--on-navy);color:var(--navy)}.st.on .dot{background:var(--orange);opacity:1}

/* hero + search */
.hero{background:var(--navy);color:var(--on-navy);padding-block:26px 84px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,5.2vw,52px);max-width:15em}
.hero p{color:var(--navy-muted);max-width:34em;margin-top:12px}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
.arc{position:absolute;right:-40px;top:10px;width:min(520px,70%);opacity:.35;pointer-events:none}
.search{margin-top:-56px;position:relative;z-index:2;padding:22px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{position:relative;min-width:0}
.field>label,.lab{display:block;font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.inp{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;min-height:48px}
.inp:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.err{color:var(--bad);font-size:13px;min-height:0;margin-top:4px}
.err:empty{display:none}
.dd{position:absolute;left:0;right:0;top:calc(100% - 2px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;max-height:380px;overflow:auto;padding:8px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;border-radius:10px;padding:8px;cursor:pointer}
.opt:hover,.opt:focus-visible{background:var(--surface2)}
.opt b{display:block;font-weight:600}.opt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.th{flex:none;width:56px;height:44px;border-radius:10px;background-size:cover;background-position:center}
.th.plain{display:grid;place-items:center;background:var(--surface2);font-size:20px;color:var(--teal-d)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 4px 10px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font:600 12.5px var(--f-body);cursor:pointer}
.chip.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.stp{display:flex;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden;min-height:48px}
.stp button{flex:none;width:48px;border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--teal-d)}
.stp button:hover{background:var(--surface2)}
.stp input{flex:1;min-width:0;border:0;background:transparent;text-align:center;font:600 18px var(--f-mono);-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:focus{outline:none}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.budget{display:grid;gap:12px}
.bhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.bval{font:700 clamp(30px,6vw,44px) var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bin{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);padding-left:12px;min-height:44px;width:190px}
.bin input{border:0;background:transparent;width:100%;padding:8px 10px 8px 4px;font:500 16px var(--f-mono);min-width:0}
.bin input:focus{outline:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:99px;background:linear-gradient(90deg,var(--teal) var(--p,15%),var(--line) var(--p,15%));outline-offset:8px;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:4px solid var(--orange);box-shadow:var(--shadow);cursor:grab}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--orange);cursor:grab}
.ticks{display:flex;justify-content:space-between;font:500 11px var(--f-mono);color:var(--muted)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:14px;background:var(--orange);color:var(--on-orange);font:800 16px var(--f-display);letter-spacing:.06em;padding:16px 20px;cursor:pointer;box-shadow:0 6px 0 color-mix(in srgb,var(--orange) 55%,#000);transition:transform .12s,box-shadow .12s}
.go:hover{transform:translateY(2px);box-shadow:0 4px 0 color-mix(in srgb,var(--orange) 55%,#000)}
.go svg{width:22px;height:22px}

/* generic */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px var(--f-body);padding:11px 18px;border-radius:12px;border:1.5px solid transparent;cursor:pointer;text-decoration:none;min-height:44px}
.btn.primary{background:var(--orange);color:var(--on-orange)}
.btn.teal{background:var(--teal);color:var(--on-teal)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--teal)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 12px var(--f-body);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--surface2);color:var(--muted)}
.sh{padding-block:28px 18px}
.sh h2{font-size:clamp(26px,4vw,38px)}
.sh .sub{color:var(--muted);margin-top:8px;max-width:48em}
.note{display:flex;gap:10px;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--muted);margin-bottom:16px}
.note b{color:var(--ink)}
.banner{border-radius:16px;padding:16px 18px;margin-bottom:16px;background:var(--bad-bg);color:var(--ink);border:1.5px solid var(--bad)}
.banner h3{font-size:18px;color:var(--bad);margin-bottom:6px}
.banner ul{margin:8px 0 12px;padding-left:18px}
.banner li{margin:2px 0}

/* tickets */
.ticket{display:grid;grid-template-columns:1fr 240px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);position:relative}
.ticket.sel{border-color:var(--teal)}
.tmain{padding:20px 22px;display:grid;gap:10px;align-content:start;min-width:0}
.tt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mode{font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.best{background:var(--orange);color:var(--on-orange);font:800 11px var(--f-body);letter-spacing:.1em;padding:3px 9px;border-radius:6px}
.tmain h3{font-size:22px}
.route{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:15px;min-width:0}
.route b{font-weight:600}
.route .dash{flex:1;min-width:24px;border-top:2px dashed var(--line);position:relative}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:0}
.kv dt{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv dd{margin:2px 0 0;font-weight:500}
.stub{border-left:2px dashed var(--line);padding:20px;display:grid;gap:8px;align-content:start;position:relative}
.stub::before,.stub::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bg);left:-11px}
.stub::before{top:-11px}.stub::after{bottom:-11px}
.stub .lbl{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.price{font:700 30px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* place / eat cards */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:12px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font:600 13px var(--f-body);cursor:pointer}
.tab.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.pc.on{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 30%,transparent)}
.pc .ph{height:116px;background-size:cover;background-position:center;position:relative}
.pc .ph .c{position:absolute;left:10px;top:10px;background:rgba(7,17,30,.72);color:#F6F1E8;font:600 11px var(--f-body);padding:3px 9px;border-radius:99px}
.pc .ph .r{position:absolute;right:10px;top:10px;background:var(--orange);color:var(--on-orange);font:800 10.5px var(--f-body);letter-spacing:.08em;padding:3px 8px;border-radius:6px}
.pc .bd{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.pc h3{font-size:18px}
.pc .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pc .act{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:space-between;padding-top:6px}
.sum{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;padding:12px 16px;margin-bottom:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.slotH{font:700 18px var(--f-display);margin:24px 0 12px}
.empty{padding:28px;text-align:center;border:2px dashed var(--line);border-radius:18px;color:var(--muted);display:grid;gap:12px;justify-items:center}

/* itinerary */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
.cost{padding:20px;display:grid;gap:10px}
.cr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.cr:last-of-type{border-bottom:0}
.cr .v{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.cr .n{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.bar1{grid-column:1/-1;height:4px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar1 i{display:block;height:100%;background:var(--teal)}
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding-top:12px}
.tot div{background:var(--bg);border-radius:12px;padding:10px 12px}
.tot dt{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tot dd{margin:2px 0 0;font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.map{padding:12px}
.map svg{display:block;width:100%;height:auto;border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.pin{cursor:pointer}
.pin:focus-visible circle{stroke:var(--orange);stroke-width:3}
#pininfo{margin-top:10px;font-size:14px;min-height:22px}
.day{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;background:var(--navy);color:var(--on-navy)}
.dh h3{font-size:20px}
.dh .pill{background:var(--on-navy);color:var(--navy)}
.dr{display:grid;grid-template-columns:104px minmax(0,1fr);gap:4px 16px;padding:14px 20px;border-top:1px solid var(--line)}
.dr:first-of-type{border-top:0}
.dr .t{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.dr ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.hop{font-size:12.5px;color:var(--muted)}
.tips{display:grid;gap:8px;margin:0;padding-left:18px}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
textarea.tx{width:100%;min-height:220px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:13px/1.5 var(--f-mono)}
.bk{padding:18px 20px;display:grid;gap:10px}
.bk h3{font-size:19px}
.bk ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk li{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.bk li:last-child{border-bottom:0}
.okbox{background:var(--ok-bg);border:1.5px solid var(--ok);border-radius:16px;padding:16px 18px}

/* budget bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(14,34,56,.08);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{display:grid;grid-template-columns:1fr auto;gap:10px 18px;align-items:center}
.nums{display:flex;gap:6px 22px;flex-wrap:wrap}
.nums div{min-width:0}
.nums dt{font:600 10.5px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.nums dd{margin:0;font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.nums dd.bad{color:var(--bad)}.nums dd.ok{color:var(--ok)}
.meter{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);transition:width .25s}
.meter.over i{background:var(--bad)}
.nav{display:flex;gap:8px}

/* flight overlay */
.fly{position:fixed;inset:0;background:var(--navy);color:var(--on-navy);z-index:60;display:grid;place-items:center;text-align:center;padding:24px;overflow:hidden}
.fly h2{font-size:clamp(24px,4vw,34px)}
.fly p{color:var(--navy-muted);margin-top:8px}
.plane{position:absolute;top:30%;left:0;width:76px;animation:fly 1.9s cubic-bezier(.5,0,.3,1) forwards}
.trail{position:absolute;top:calc(30% + 36px);left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--on-navy) 0 10px,transparent 10px 22px);opacity:.28}
@keyframes fly{from{transform:translateX(-100px)}to{transform:translateX(calc(100vw + 30px))}}

@media (max-width:860px){.two{grid-template-columns:1fr}}
@media (max-width:700px){
  .ticket{grid-template-columns:1fr}
  .stub{border-left:0;border-top:2px dashed var(--line)}
  .stub::before{top:-11px;left:-11px}.stub::after{top:-11px;bottom:auto;left:auto;right:-11px}
  .dr{grid-template-columns:1fr}
}
@media (max-width:560px){
  .g2{grid-template-columns:1fr}
  .search{padding:16px}
  .bar .in{grid-template-columns:1fr}
  .nav .btn{flex:1}
  body.hasbar #app{padding-bottom:210px}
  .tagline{display:none}
}
@media (prefers-reduced-motion:reduce){.plane{animation-duration:.01s}.go{transition:none}.meter i{transition:none}}

/* ---- site nav, animation, photos, map ---- */
.sitenav{display:flex;gap:4px;align-items:center}
.sitenav a{color:var(--navy-muted);text-decoration:none;font:600 14px var(--f-body);padding:8px 14px;border-radius:99px;transition:background .2s,color .2s}
.sitenav a:hover{color:var(--on-navy);background:rgba(255,255,255,.1)}
.sitenav a[aria-current]{color:var(--navy);background:var(--on-navy)}

const tmin=(a,b)=>Math.max(5,Math.round(hav(a.lat,a.lng,b.lat,b.lng)*1.4/22*60));
function buildItin(){

  const days=caps.map(()=>({ps:[],used:0})),left=[];let di=0;

    let placed=false;

      if(!dy.ps.length||(dy.used+tt+p.hrs<=caps[di]&&dy.ps.length<4)){dy.used+=tt+p.hrs;dy.ps.push(p);placed=true;break}di++}
    if(!placed)left.push(p)}
  const E_=d.eats.filter(e=>S.eats.has(e.id)),by=s=>E_.filter(e=>e.slot===s);
  const nn=nights(),loc=plan().loc,st=plan().stay,fpp=foodPD();

    const ps=dy.ps.slice().sort((a,b)=>(a.slot==='m'?0:a.slot==='e'?2:1)-(b.slot==='m'?0:b.slot==='e'?2:1));

function pagePlaces(){
  const d=S.dest;S.rec=new Set(d.places.length?recPlaces():[]);
  const it=buildItin(),cats=['all'].concat(Object.keys(CAT).filter(c=>d.places.some(p=>p.cat===c)));
  const list=d.places.filter(p=>S.pcat==='all'||p.cat===S.pcat);
  const hrs=d.places.filter(p=>S.places.has(p.id)).reduce((a,p)=>a+p.hrs,0);
  return stepHead('What do you want to see?','Recommendations weigh your budget, number of days, distance and cost. Pick what you like. Entry fees are indicative, and opening hours are not verified.')+overBanner()+
  (d.places.length?`<div class="sum"><span><b>${S.places.size}</b> selected · about ${fmtH(hrs||0.5)} of sightseeing across ${S.days} day${S.days>1?'s':''}</span>${it.left.length?'<span class="pill bad">'+it.left.length+' will not fit. Add days or remove stops.</span>':'<span class="pill ok">Fits your days</span>'}<button class="btn ghost sm" data-act="resetplaces">Reset to recommended</button></div>
  <div class="tabs" role="tablist">${cats.map(c=>`<button class="tab ${S.pcat===c?'on':''}" data-act="pcat" data-c="${c}" role="tab" aria-selected="${S.pcat===c}">${c==='all'?'All':CAT[c]}</button>`).join('')}</div>

function mealLine(m,label,dayHint){return m?`<li><b>${esc(m.name)}</b> · ~${inr(m.cost)} per person <a class="small" href="${gm(m.where)}" target="_blank" rel="noopener">Map ↗</a></li>`:`<li class="muted">${label}: a local spot near ${esc(dayHint)}, budget about ${inr(({Breakfast:70,Lunch:150,Dinner:220}[label]||60)*S.dest.ci)} per person. <a class="small" href="${gm(label.toLowerCase()+' near '+dayHint+' '+S.dest.name)}" target="_blank" rel="noopener">Search ↗</a></li>`}
function pageItin(){
  const it=buildItin(),p=plan(),d=S.dest,T=p.T,nn=nights(),st=p.stay;window.__it=it;
  const status=p.total<=S.budget?'<span class="pill ok">Within budget</span>':'<span class="pill bad">Over budget by '+inr(p.total-S.budget)+'</span>';
  const cost=`<section class="card cost"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3>Cost breakdown</h3>${status}</div><p class="small muted">Indicative estimates. No live prices.</p>
   <div>${p.lines.map(l=>`<div class="cr"><span>${l.k}</span><span class="v">${inr(l.v)}</span><span class="n">${esc(l.n)}</span><span class="bar1"><i style="width:${Math.min(100,p.total?l.v/p.total*100:0).toFixed(1)}%"></i></span></div>`).join('')}</div>
   <dl class="tot"><div><dt>Total estimate</dt><dd>${inr(p.total)}</dd></div><div><dt>Per person</dt><dd>${inr(p.pp)}</dd></div><div><dt>Per day</dt><dd>${inr(p.perDay)}</dd></div><div><dt>${p.remaining>=0?'Remaining':'Shortfall'}</dt><dd style="color:var(--${p.remaining>=0?'ok':'bad'})">${inr(Math.abs(p.remaining))}</dd></div></dl></section>`;
  const days=it.days.map(dy=>{
    const first=dy.i===0,last=dy.i===S.days-1,hint=(dy.ps[0]&&dy.ps[0].name)||d.name,sl=dy.slots;
    const place=(q,ix)=>q.map(x=>`<li><b>${esc(x.name)}</b> · ${fmtH(x.hrs)}, ${x.fee?'~'+inr(x.fee)+' pp':'free or nominal'} <a class="small" href="${gm(x.name+' '+d.name)}" target="_blank" rel="noopener">Map ↗</a></li>`).join('');
    const hop=()=>{const a=dy.ps;if(a.length<2)return'';return'<p class="hop">Between stops: '+a.slice(1).map((x,i)=>'~'+tmin(a[i],x)+' min').join(', ')+' by road (estimate)</p>'};
    const rt=dayRouteLink(dy);
    const curated=(d.cmsItineraries||[]).filter(x=>Number(x.day_number||1)===dy.i+1).sort((a,b)=>String(a.start_time||'').localeCompare(String(b.start_time||'')));
    return`<article class="day"><div class="dh"><h3>Day ${dy.i+1} · ${dy.title}</h3><span class="pill">Spend about ${inr(dy.cost)}</span></div>
     ${curated.length?`<div class="dr"><span class="t">SAFAR PLAN</span><div><ul>${curated.map(x=>`<li><b>${esc(x.start_time||'')}${x.end_time?'–'+esc(x.end_time):''} ${esc(x.title||x.place_name||'Activity')}</b>${x.description?' · '+esc(x.description):''}${Number(x.estimated_cost)>0?' · ~'+inr(Number(x.estimated_cost))+' estimated':''}${x.notes?' <span class="muted">('+esc(x.notes)+')</span>':''}</li>`).join('')}</ul></div></div>`:''}
     ${first?`<div class="dr"><span class="t">Getting there</span><div>${T.mode} · ${esc(T.cls||'')}, about ${fmtH(T.hrs||1)} from ${esc(S.origin.name)}.${nn>0&&st?' Then check in to your '+st.name.toLowerCase()+'.':''}</div></div>`:''}
     <div class="dr"><span class="t">Morning</span><div><ul>${sl.m.length?place(sl.m):'<li class="muted">'+(first?'Travel and arrive':'Slow start, nearby walk')+'</li>'}</ul></div></div>
     <div class="dr"><span class="t">Breakfast</span><div><ul>${mealLine(dy.b,'Breakfast',hint)}</ul></div></div>
     <div class="dr"><span class="t">Lunch</span><div><ul>${mealLine(dy.l,'Lunch',hint)}</ul></div></div>
     <div class="dr"><span class="t">Afternoon</span><div><ul>${sl.a.length?place(sl.a):'<li class="muted">Rest or explore nearby lanes</li>'}</ul>${hop()}</div></div>
     <div class="dr"><span class="t">Evening</span><div><ul>${sl.e.length?place(sl.e):'<li class="muted">Free evening. Try a local market or promenade.</li>'}${dy.s?mealLine(dy.s,'Snack',hint):''}</ul></div></div>
     <div class="dr"><span class="t">Dinner</span><div><ul>${mealLine(dy.d,'Dinner',hint)}</ul></div></div>
     ${last?`<div class="dr"><span class="t">Return</span><div>Head home by ${T.mode.toLowerCase()} (${esc(T.cls||'')}), about ${fmtH(T.hrs||1)}. Leave buffer time for the journey.</div></div>`:''}
     ${rt?`<div class="dr"><span class="t">Route</span><div><a href="${rt}" target="_blank" rel="noopener">Open Day ${dy.i+1} stops in Google Maps ↗</a></div></div>`:''}</article>`}).join('');
  return stepHead('Your itinerary',esc(S.origin.name)+' to '+esc(d.name)+' · '+S.days+' days · '+pl(S.n))+
  overBanner()+(it.left.length?`<div class="banner"><h3>${it.left.length} selected place${it.left.length>1?'s':''} did not fit</h3><p>${it.left.map(x=>esc(x.name)).join(', ')}. Add a day, or remove a stop on the Places step.</p></div>`:'')+
  `<div class="two">${cost}<section class="card map"><div id="gmap" class="gmap" role="region" aria-label="Map of your itinerary"><p class="small muted" style="padding:16px">Loading map…</p></div><div class="legend">${it.days.filter(dy=>dy.ps.length).map(dy=>'<span><i style="background:hsl('+[190,22,265,140,330,48][dy.i%6]+' 60% 42%)"></i>Day '+(dy.i+1)+'</span>').join('')}</div><div id="pininfo" class="muted small" style="margin-top:8px">Tap a pin for details. The dark marker is the middle of ${esc(d.name)}. Pins use approximate coordinates, so check the exact spot before you travel.</div></section></div>
  <div class="stack" style="margin-top:20px">${days}</div>
  <section class="card cost" style="margin-top:20px"><h3>Travel tips</h3><ul class="tips">${d.tips.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul></section>
  <div class="card cost" style="margin-top:20px"><h3>Keep this trip in your account</h3><p class="muted">Save your selected destination, travel option, stay, food, local transport, itinerary and budget to My Trips. You can return to it later.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn teal" data-act="saveTrip" id="saveTripBtn">Save trip to My Trips</button><span id="saveTripMsg" class="small muted" role="status" aria-live="polite"></span></div></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn primary" data-act="go" data-to="booking">Approve and go to booking</button><button class="btn ghost" data-act="go" data-to="places">Change places</button></div></div>`}

function makeTripSnapshot(){
  const p=plan(),it=buildItin(),d=S.dest,T=p.T,st=p.stay,lo=p.loc;
  const pick=(arr,id)=>arr.find(x=>x.id===id)||null;
  const clean=x=>x?JSON.parse(JSON.stringify(x)):null;
  return {
    destination_id:d.dbid||null, destination_slug:d.id, destination_state:d.state||'',
    origin:S.origin.name, destination:d.name, duration_days:S.days,
    travellers:S.n, budget:S.budget, estimated_total:Math.round(p.total), per_person:Math.round(p.pp),
    remaining:Math.round(p.remaining), generated_at:new Date().toISOString(),
    travel:clean(T), stay:clean(st), local_transport:clean(lo),
    selected_places:d.places.filter(x=>S.places.has(x.id)).map(clean),
    selected_food:d.eats.filter(x=>S.eats.has(x.id)).map(clean),
    days:it.days.map(dy=>({day:dy.i+1,title:dy.title,estimated_cost:Math.round(dy.cost),places:dy.ps.map(x=>({id:x.id,name:x.name,description:x.desc,entry_fee:x.fee,duration_hours:x.hrs,latitude:x.lat,longitude:x.lng})),morning:dy.slots.m.map(x=>x.name),afternoon:dy.slots.a.map(x=>x.name),evening:dy.slots.e.map(x=>x.name),breakfast:dy.b?{name:dy.b.name,price:dy.b.cost}:null,lunch:dy.l?{name:dy.l.name,price:dy.l.cost}:null,dinner:dy.d?{name:dy.d.name,price:dy.d.cost}:null,snack:dy.s?{name:dy.s.name,price:dy.s.cost}:null})),
    cost_breakdown:p.lines.map(x=>({category:x.k,amount:Math.round(x.v),note:x.n})),
    itinerary_text:itinText(),
    indicative_prices:true
  };
}
async function saveCurrentTrip(){
  const btn=document.getElementById('saveTripBtn'),msg=document.getElementById('saveTripMsg');
  if(btn){btn.disabled=true;btn.textContent='Saving…'} if(msg)msg.textContent='';
  try{
    const payload=makeTripSnapshot(),client=window.supabaseClient;
    if(!client)throw new Error('Connection to Safar Planner is unavailable. Please refresh and try again.');
    const {data:{session},error:sessionError}=await client.auth.getSession();
    if(sessionError)throw sessionError;
    if(!session){localStorage.setItem('safarplanner_pending_trip',JSON.stringify(payload));location.href='account.html?saveTrip=1';return;}
    const {error:insertError}=await client.from('user_trips').insert({user_id:session.user.id,destination_name:payload.destination,travellers:payload.travellers,budget:payload.budget,estimated_cost:payload.estimated_total,status:'planned',itinerary:payload});
    if(insertError)throw insertError;
    if(msg)msg.textContent='Trip saved! You can find it in My Trips.';
    if(btn){btn.textContent='Saved to My Trips ✓';btn.disabled=true;}
  }catch(err){console.error('Save trip failed:',err);if(msg)msg.textContent=err.message||'Could not save this trip. Please try again.';if(btn){btn.disabled=false;btn.textContent='Save trip to My Trips';}}
}

function itinText(){
  const it=buildItin(),p=plan(),d=S.dest,T=p.T;let t='TRIP: '+S.origin.name+' to '+d.name+' · '+S.days+' days · '+pl(S.n)+'\nBudget '+inr(S.budget)+' · estimated total '+inr(p.total)+' (per person '+inr(p.pp)+')\nAll prices are indicative estimates.\n\n';
  t+='TRAVEL: '+T.mode+' ('+(T.cls||'')+'), return, about '+inr(T.total||0)+' for the group\n';
  if(p.stay)t+='STAY: '+p.stay.name+', '+nights()+' night(s), about '+inr(p.stay.total)+'\n';
  t+='LOCAL: '+(p.loc.name||'')+'\n\n';
  it.days.forEach(dy=>{t+='DAY '+(dy.i+1)+' · '+dy.title+' (about '+inr(dy.cost)+')\n';
    (d.cmsItineraries||[]).filter(x=>Number(x.day_number||1)===dy.i+1).forEach(x=>{t+='  SAFAR PLAN: '+(x.start_time||'')+' '+(x.title||x.place_name||'Activity')+' · '+(x.description||'')+(Number(x.estimated_cost)>0?' · '+inr(Number(x.estimated_cost)):'')+'\n'});
    [['Morning',dy.slots.m],['Afternoon',dy.slots.a],['Evening',dy.slots.e]].forEach(([k,l])=>{if(l.length)t+='  '+k+': '+l.map(x=>x.name).join(', ')+'\n'});
    if(dy.b)t+='  Breakfast: '+dy.b.name+'\n';if(dy.l)t+='  Lunch: '+dy.l.name+'\n';if(dy.d)t+='  Dinner: '+dy.d.name+'\n';t+='\n'});
  return t+'COST BREAKDOWN\n'+p.lines.map(l=>'  '+l.k+': '+inr(l.v)).join('\n')+'\n  Total: '+inr(p.total)+'\n  Remaining: '+inr(p.remaining)}

function pageBook(){
  const p=plan(),d=S.dest,T=p.T,st=p.stay,lo=p.loc,sel=d.places.filter(x=>S.places.has(x.id)),eats=d.eats.filter(x=>S.eats.has(x.id));
  const li=(a,b)=>`<li><span>${a}</span><span>${b}</span></li>`;
  const stLink=st?((st.id==='dorm'||st.id==='hostel')?['Hostelworld','https://www.hostelworld.com/']:['Booking.com','https://www.booking.com/searchresults.html?ss='+enc(d.name)+'&group_adults='+S.n+'&no_rooms='+Math.ceil(S.n/2)]):null;
  return stepHead('Booking assistance','Safar does not take payments or confirm reservations. Use these links to book each part with the provider.')+
  (S.confirmed?`<div class="okbox" role="status"><b>Plan marked as ready.</b> Nothing has been booked or paid for. Use the links below to book each part.</div><br>`:'')+
  `<div class="stack">
  <section class="card bk"><h3>Travel</h3><ul>${li(esc(T.mode)+' · '+esc(T.cls||'')+', return for '+pl(S.n)+' (about '+inr(T.total||0)+')',T.link?`<a href="${T.link[1]}" target="_blank" rel="noopener">${esc(T.link[0])} ↗</a>`:'')}</ul></section>
  <section class="card bk"><h3>Stay</h3><ul>${st?li(esc(st.name)+', '+nights()+' night(s), about '+inr(st.total),`<a href="${stLink[1]}" target="_blank" rel="noopener">${stLink[0]} ↗</a> · <a href="${gm(st.name.toLowerCase()+' in '+d.name)}" target="_blank" rel="noopener">Maps ↗</a>`):li('Day trip, no stay needed','')}</ul></section>
  <section class="card bk"><h3>Getting around locally</h3><ul>${li(esc(lo.name||'')+(lo.dep?'. Deposit: '+esc(lo.dep):''),lo.link?`<a href="${lo.link[1]}" target="_blank" rel="noopener">${esc(lo.link[0])} ↗</a>`:'')}</ul><p class="small muted">Rental contact numbers are not listed. Call the shop to confirm stock before you go.</p></section>
  <section class="card bk"><h3>Places and activities</h3><ul>${sel.map(x=>li(esc(x.name)+(x.fee?' · ~'+inr(x.fee)+' pp':''),`<a href="${gm(x.name+' '+d.name)}" target="_blank" rel="noopener">Map ↗</a>${x.act?' · <a href="https://www.getyourguide.com/s/?q='+enc(x.name+' '+d.name)+'" target="_blank" rel="noopener">Find tickets ↗</a>':''}`)).join('')||'<li class="muted">No places selected.</li>'}</ul></section>
  <section class="card bk"><h3>Food</h3><ul>${eats.map(x=>li(esc(x.name),`<a href="${gm(x.where)}" target="_blank" rel="noopener">Map ↗</a>`)).join('')||'<li class="muted">No places selected.</li>'}</ul></section>
  <section class="card bk"><h3>Important numbers (India)</h3><ul>${li('All emergencies','<b class="mono">112</b>')}${li('Railway enquiry','<b class="mono">139</b>')}${li('Tourist helpline','<b class="mono">1363</b>')}${li('Women helpline','<b class="mono">1091</b>')}</ul></section>
  <section class="card bk"><h3>Your itinerary, as text</h3><p class="small muted">Copy it into a document and save as a PDF if you want a file to carry. A built-in PDF download needs the server-side export planned for the full app.</p>
   <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn teal" data-act="copy">Copy itinerary text</button><span id="copied" class="small muted" role="status"></span></div>
   <details><summary>Show the text</summary><textarea class="tx" id="itx" readonly>${esc(itinText())}</textarea></details></section>
  </div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px"><button class="btn primary" data-act="confirm">${S.confirmed?'Plan marked ready ✓':'Mark my plan as ready'}</button><button class="btn ghost" data-act="go" data-to="itinerary">Back to itinerary</button><button class="btn ghost" data-act="newtrip">Plan another trip</button></div></div>`}

/* ---------- rendering ---------- */
const PAGES={home:pageHome,transport:pageTransport,places:pagePlaces,stay:pageStay,food:pageFood,local:pageLocal,itinerary:pageItin,booking:pageBook};
function seq(){return ROUTES.filter(r=>!(r==='stay'&&nights()===0))}
function renderSteps(){
  $('#steps').innerHTML=seq().map(r=>{const done=S.visited.has(r)&&r!==route;return`<button class="st ${r===route?'on':''} ${done?'done':''}" ${done?`data-act="go" data-to="${r}"`:'disabled'} ${r===route?'aria-current="step"':''}><span class="dot"></span>${STEPN[r]}</button>`}).join('')}
function renderBar(){
  const b=$('#bar');
  if(route==='home'||route==='booking'||!S.ready){b.hidden=true;document.body.classList.remove('hasbar');return}
  const p=plan(),q=seq(),ix=q.indexOf(route),pct=Math.min(100,p.total/S.budget*100),over=p.total>S.budget;
  b.hidden=false;document.body.classList.add('hasbar');
  b.innerHTML=`<div class="wrap in"><dl class="nums" style="margin:0"><div><dt>Budget</dt><dd>${inr(S.budget)}</dd></div><div><dt>Estimated</dt><dd>${inr(p.total)}</dd></div><div><dt>${over?'Over by':'Remaining'}</dt><dd class="${over?'bad':'ok'}">${inr(Math.abs(p.remaining))}</dd></div><div><dt>Per person</dt><dd>${inr(p.pp)}</dd></div></dl>
  <div class="nav"><button class="btn ghost" data-act="go" data-to="${q[Math.max(0,ix-1)]}">Back</button>${ix<q.length-1&&route!=='itinerary'?`<button class="btn primary" data-act="go" data-to="${q[ix+1]}">Next: ${STEPN[q[ix+1]]}</button>`:''}</div>
  <div class="meter ${over?'over':''}" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="Share of budget used"><i style="width:${pct}%"></i></div></div>`}
function render(keep){
  const y=window.scrollY;
  let r=(location.hash||'#home').slice(1);if(!ROUTES.includes(r))r='home';
  if(r!=='home'&&!S.ready)r='home';
  if(r==='stay'&&nights()===0)r='food';
  route=r;S.visited.add(r);
  if(r!=='home')ensure();
  $('#app').innerHTML=PAGES[r]();
  renderSteps();renderBar();
  if(r==='home')bindHome();
  if(r==='itinerary')drawMap(window.__it);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)document.querySelectorAll('animateMotion').forEach(a=>a.remove());
  if(keep)window.scrollTo(0,y)}
function go(r){if(location.hash==='#'+r)render();else location.hash=r}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ---------- home form ---------- */
function setBudget(v,from){v=Math.max(0,Math.min(MAXB,Math.round(v)||0));S.budget=v;
  const r=$('#budget');if(r){r.value=v;r.style.setProperty('--p',(v/MAXB*100)+'%')}
  const o=$('#bval');if(o)o.textContent=inr(v);
  const nI=$('#bnum');if(nI&&from!=='num')nI.value=v.toLocaleString('en-IN');
  hints()}
function hints(){
  const n=Math.max(1,parseInt($('#n').value)||1),dd=Math.max(1,parseInt($('#days').value)||1);
  $('#h-n').textContent=n===1?'Solo traveller':n===2?'Couple or two friends':n<=5?'Family or small group':'Group travel';
  $('#h-days').textContent=dd===1?'A day trip, no overnight stay':dd+' days, '+(dd-1)+' night'+(dd>2?'s':'');
  $('#h-b').textContent='About '+inr(S.budget/(n*dd))+' per person per day, all included.'}
function ddDest(){
  const dd=$('#dd-dest'),raw=$('#dest').value,q=raw.trim().toLowerCase();let list,head='';
  if(!q){head='<div class="chips">'+GRP.map(([k,l])=>`<button type="button" class="chip ${S.grp===k?'on':''}" data-act="grp" data-g="${k}">${l}</button>`).join('')+'</div>';list=D.filter(d=>d.tags.includes(S.grp))}
  else list=D.filter(d=>(d.name+' '+d.state).toLowerCase().includes(q)||d.tags.some(t=>t.startsWith(q)));
  const exact=D.some(d=>d.name.toLowerCase()===q);
  dd.innerHTML=head+list.slice(0,8).map(d=>`<button type="button" class="opt" data-act="pickdest" data-id="${d.id}"><span class="th" data-q="${esc(wq(d))}" style="background-image:${art(d.hue,d.k)}"></span><span><b>${d.name}, ${d.state}</b><small>${d.blurb}${d.cur?'':' (basic estimates)'}</small></span></button>`).join('')+
   (q&&!exact?`<button type="button" class="opt" data-act="pickcustom"><span class="th plain">+</span><span><b>Use “${esc(raw.trim())}”</b><small>Not in our list. You will enter the road distance, and estimates stay basic.</small></span></button>`:'');
  dd.hidden=false;$('#dest').setAttribute('aria-expanded','true')}
function ddOrigin(){
  const dd=$('#dd-origin'),q=$('#origin').value.trim().toLowerCase();
  const l=ORIGINS.filter(o=>!q||o[0].toLowerCase().includes(q)).slice(0,8);
  dd.innerHTML=l.map(o=>`<button type="button" class="opt" data-act="pickorigin" data-n="${o[0]}"><span class="th plain">⌂</span><span><b>${o[0]}</b></span></button>`).join('')+(q&&!l.some(o=>o[0].toLowerCase()===q)?`<button type="button" class="opt" data-act="pickorigincustom"><span class="th plain">+</span><span><b>Use “${esc($('#origin').value.trim())}”</b><small>Not in our list. You will enter the road distance.</small></span></button>`:'');
  dd.hidden=false;$('#origin').setAttribute('aria-expanded','true')}
function closeDD(){document.querySelectorAll('.dd').forEach(x=>x.hidden=true)}
function bindHome(){
  $('#dest').addEventListener('input',ddDest);$('#dest').addEventListener('focus',ddDest);
  $('#origin').addEventListener('input',ddOrigin);$('#origin').addEventListener('focus',ddOrigin);
  ['dest','origin'].forEach(id=>$('#'+id).addEventListener('keydown',e=>{if(e.key==='Escape')closeDD()}));
  $('#n').addEventListener('input',hints);$('#days').addEventListener('input',hints);
  $('#budget').addEventListener('input',e=>setBudget(+e.target.value));
  $('#bnum').addEventListener('input',e=>{const v=parseInt(e.target.value.replace(/[^\d]/g,''))||0;setBudget(v,'num')});
  $('#bnum').addEventListener('blur',()=>{$('#bnum').value=S.budget.toLocaleString('en-IN')});
  $('#f').addEventListener('submit',e=>{e.preventDefault();try{submit()}catch(err){console.error('Safar Planner search failed:',err);showSubmitError('Something went wrong while building your trip. Please check your entries and try again.')}});
  setBudget(S.budget);}
function showSubmitError(message){let box=$('#e-submit');if(!box){box=document.createElement('p');box.id='e-submit';box.className='err';$('#f').appendChild(box)}box.textContent=message;box.scrollIntoView({block:'center',behavior:'smooth'});}
function submit(){
  const status=$('#e-submit');if(status)status.textContent='';
  const err={},dt=$('#dest').value.trim(),ot=$('#origin').value.trim(),n=Number($('#n').value),dd=Number($('#days').value);
  const kmv=$('#km')?Number($('#km').value):0;
  const dest=D.find(d=>d.name.toLowerCase()===dt.toLowerCase())||(dt?{id:'x-'+dt.toLowerCase().replace(/\W+/g,'-'),name:dt.replace(/\b\w/g,c=>c.toUpperCase()),state:'',lat:null,lng:null,tags:[],blurb:'',hue:200,k:'compass',rail:'near',air:'near',leg:{c:350,h:3},ci:1,cur:false,places:[],eats:null,tips:GENTIPS.slice(),areas:'A central area near the main market or bus stand'}:null);
  const org=findOrigin(ot)||(ot?{name:ot.replace(/\b\w/g,c=>c.toUpperCase()),lat:null,lng:null}:null);
  if(dest&&dest.eats===null){const d=dest;d.eats=[E('b','Local breakfast (tiffin or paratha stall)','Regional',70,'breakfast in '+d.name),E('l','Local thali or meals','Regional',150,'thali in '+d.name),E('d','Family restaurant dinner','Regional',220,'family restaurant in '+d.name),E('s','Street food and tea','Street food',60,'street food in '+d.name)];d.eats.forEach((e,i)=>e.id=d.id+'-e'+i)}
  if(!dt)err.dest='Enter a destination.';
  if(!ot)err.origin='Enter your starting city.';
  if(dt&&ot&&dest&&org&&dest.name.toLowerCase()===org.name.toLowerCase())err.dest='Your destination and starting point are the same.';
  if(!Number.isInteger(n)||n<1)err.n='Enter a whole number of 1 or more.';
  if(!Number.isInteger(dd)||dd<1||dd>365)err.days='Enter a whole number from 1 to 365.';
  if(!(S.budget>0))err.b='Set a budget above ₹0.';
  const need=(dest&&org)&&(dest.lat==null||org.lat==null);
  $('#kmrow').hidden=!need;
  if(need&&!(kmv>=1))err.km='Enter the approximate road distance in km.';
  ['dest','origin','n','days','b','km'].forEach(k=>{const el=$('#e-'+k);if(el)el.textContent=err[k]||''});
  if(Object.keys(err).length){const f=document.querySelector('.err:not(:empty)');if(f)f.scrollIntoView({block:'center',behavior:'smooth'});return}
  Object.assign(S,{destText:dt,originText:ot,dest,origin:org,n,days:dd,km:need?kmv:null,ready:true,tidAuto:true,stayAuto:true,localAuto:true,placesInit:false,eatsInit:false,pcat:'all',confirmed:false,tid:null});
  S.visited=new Set(['home']);S.places=new Set();S.eats=new Set();
  closeDD();
  const fl=$('#fly');
  if(fl){
    $('#flyroute').textContent=org.name+' → '+dest.name;
    fl.hidden=false;
    const plane=fl.querySelector('.plane');
    if(plane){plane.style.animation='none';void plane.offsetWidth;plane.style.animation='';}
  }
  const calm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Keep the original flying-plane transition before opening the transport results.
  setTimeout(()=>{
    if(fl)fl.hidden=true;
    go('transport');
    window.scrollTo(0,0);
  },calm?700:2100);
}

/* ---------- actions ---------- */
document.addEventListener('click',e=>{
  if(!e.target.closest('.field'))closeDD();
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
   case'home':e.preventDefault();go('home');break;
   case'go':go(b.dataset.to);window.scrollTo(0,0);break;
   case'inc':{const i=$('#'+b.dataset.f),v=Math.max(1,(parseInt(i.value)||1)+Number(b.dataset.d));i.value=v;hints();break}
   case'grp':S.grp=b.dataset.g;ddDest();break;
   case'popdest':{const d=D.find(x=>x.id===b.dataset.id);$('#dest').value=d.name;window.scrollTo({top:0,behavior:'smooth'});closeDD();$('#dest').focus({preventScroll:true});closeDD();break}
   case'pickdest':{const d=D.find(x=>x.id===b.dataset.id);$('#dest').value=d.name;closeDD();break}
   case'pickcustom':closeDD();break;
   case'pickorigin':$('#origin').value=b.dataset.n;closeDD();break;
   case'pickorigincustom':closeDD();break;
   case'tid':S.tid=b.dataset.id;S.tidAuto=false;render(true);break;
   case'place':{const id=b.dataset.id;S.places.has(id)?S.places.delete(id):S.places.add(id);render(true);break}
   case'pcat':S.pcat=b.dataset.c;render(true);break;
   case'resetplaces':S.places=new Set(recPlaces());render(true);break;
   case'stay':S.stayId=b.dataset.id;S.stayAuto=false;render(true);break;
   case'eat':{const id=b.dataset.id;S.eats.has(id)?S.eats.delete(id):S.eats.add(id);render(true);break}
   case'reseteats':S.eats=new Set(recEats());render(true);break;
   case'local':S.localId=b.dataset.id;S.localAuto=false;render(true);break;
   case'cheap':{const ol=opts().slice().sort((x,y)=>x.total-y.total),st=stays().slice().sort((x,y)=>x.total-y.total);
     if(ol[0]){S.tid=ol[0].id;S.tidAuto=false}if(nights()>0){S.stayId=st[0].id;S.stayAuto=false}S.localId='walk';S.localAuto=false;render(true);break}
   case'pin':{const it=buildItin(),p=S.dest.places.find(x=>x.id===b.dataset.id),el=$('#pininfo');
     if(p&&el)el.innerHTML='<b>Day '+(Number(b.dataset.day)+1)+' · '+esc(p.name)+'</b>. '+esc(p.desc)+' <a href="'+gm(p.name+' '+S.dest.name)+'" target="_blank" rel="noopener">Open in Google Maps ↗</a>';break}
   case'copy':{const t=$('#itx').value,m=$('#copied');
     const fb=()=>{const x=$('#itx');x.closest('details').open=true;x.focus();x.select();m.textContent='Text selected. Press Ctrl/Cmd+C to copy.'};
     if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>{m.textContent='Copied.'}).catch(fb);else fb();break}
   case'confirm':S.confirmed=true;render(true);break;
   case'saveTrip':saveCurrentTrip();break;
   case'newtrip':S.ready=false;S.visited=new Set(['home']);go('home');break}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pin')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

async function loadPublishedDestinations(){
 const client=window.supabaseClient;if(!client)return;
 const {data,error}=await client.from('destinations').select('id,name,slug,state,description,image_url,tags,latitude,longitude,is_published').eq('is_published',true);
 if(error){console.warn('Could not load published destinations:',error.message);return;}
 for(const row of (data||[])){
  const id=(row.slug||row.name||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(!id)continue;
  let d=D.find(x=>x.id===id||x.name.toLowerCase()===String(row.name||'').toLowerCase());
  if(!d){let tags=Array.isArray(row.tags)?row.tags:[];tags=tags.map(x=>String(x).toLowerCase()).filter(x=>GRP.some(g=>g[0]===x));if(!tags.length)tags=['visited'];d={id,name:row.name,state:row.state||'',lat:Number(row.latitude)||0,lng:Number(row.longitude)||0,tags,blurb:row.description||'A destination selected by Safar Planner.',hue:165,k:'compass',rail:'near',air:'near',leg:{c:350,h:3},ci:1,cur:false,areas:'A central area near the main market or bus stand',tips:GENTIPS.slice(),places:[],eats:[]};D.push(d)}
  Object.assign(d,{dbid:row.id,image_url:row.image_url||d.image_url,blurb:row.description||d.blurb,state:row.state||d.state});
  const names=['destination_places','destination_food','destination_stays','destination_transport','destination_itineraries','destination_travel_options'];
  const res=await Promise.all(names.map(t=>client.from(t).select('*').eq('destination_id',row.id).eq('is_published',true).order('sort_order')));
  const c={};names.forEach((t,i)=>{if(res[i].error){console.warn('Could not load '+t,res[i].error.message);c[t]=[]}else c[t]=res[i].data||[]});
  const cats={viewpoint:'V',nature:'N',culture:'C',history:'C',food:'F',shopping:'S',activity:'L',temple:'C',waterfall:'N',fort:'C'};
  d.places=c.destination_places.map(x=>({id:'cms-p-'+x.id,cat:cats[String(x.category||'').toLowerCase()]||'H',name:x.name,desc:x.description||'',fee:Number(x.entry_fee)||0,hrs:Math.max(.25,parseFloat(x.visit_duration)||1),lat:Number(x.latitude)||d.lat,lng:Number(x.longitude)||d.lng,slot:'m',address:x.address,map_url:x.map_url,tips:x.tips,image_urls:x.image_urls||[]}));
  const slots={breakfast:'b',brunch:'b',lunch:'l',dinner:'d',snacks:'s','street food':'s',tea:'s'};
  d.eats=c.destination_food.map(x=>({id:'cms-e-'+x.id,slot:slots[String(x.meal_type||'').toLowerCase()]||'l',name:x.name,cuis:x.cuisine||'Local',cost:Number(x.price_min)||Number(x.price_max)||0,where:x.map_url||x.address||x.name+' '+d.name,tourist:false,description:x.description,must_try:x.must_try,image_urls:x.image_urls||[]}));
  d.cmsStays=c.destination_stays;d.cmsTransport=c.destination_transport;d.cmsItineraries=c.destination_itineraries;d.cmsTravel=c.destination_travel_options;
  const tips=c.destination_places.map(x=>x.tips).filter(Boolean);if(tips.length)d.tips=tips;
 }
}
(async()=>{
  try{await loadPublishedDestinations();}catch(e){console.warn('Destination sync failed:',e);}
  try{const q=new URLSearchParams(location.search).get('dest');const d0=q&&D.find(x=>x.id===q);if(d0)S.destText=d0.name}catch(e){}
  render();
})();
</script>
