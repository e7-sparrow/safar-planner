<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel guide · Safar Planner</title><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#F6F1E8;--surface:#FFFCF6;--ink:#0E2238;--muted:#52616F;--orange:#E4702B;--teal:#12808A}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 'Instrument Sans',sans-serif}.nav{background:#0E2238;color:#fff;padding:20px max(22px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;gap:15px}.nav a{color:#fff;text-decoration:none}.wrap{max-width:850px;margin:50px auto;padding:0 22px}.back{color:var(--teal);font-weight:700;text-decoration:none}.cover{width:100%;max-height:440px;object-fit:cover;border-radius:20px;margin:24px 0}.meta{color:var(--muted);font-size:14px}.category{color:var(--teal);font-weight:700;text-transform:uppercase;font-size:13px}h1{font:800 clamp(34px,6vw,56px)/1.08 'Bricolage Grotesque',sans-serif;letter-spacing:-.04em;margin:12px 0 18px}.excerpt{font-size:20px;color:var(--muted)}.content{background:var(--surface);padding:clamp(22px,5vw,48px);border-radius:20px;margin-top:28px;white-space:pre-wrap;overflow-wrap:anywhere}.content p{margin:0 0 1.2em}.status{padding:40px;background:var(--surface);border-radius:18px}@media(max-width:600px){.wrap{margin:30px auto}.content{padding:22px}}</style></head><body><header class="nav"><a href="index.html"><b>Safar Planner</b></a><a href="../index-standalone.html">Home ↗</a></header><main class="wrap"><a class="back" href="index.html">← Back to blog</a><div id="article" class="status">Loading article…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/config.js"></script><script>const root=document.getElementById('article');(async()=>{try{const slug=new URLSearchParams(location.search).get('slug');if(!slug)throw Error('Article not found.');const {data,error}=await window.supabaseClient.from('blog_posts').select('*').eq('slug',slug).eq('is_published',true).maybeSingle();if(error)throw error;if(!data)throw Error('This article is unavailable or has not been published.');document.title=data.title+' · Safar Planner';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const paragraphs=(data.content||'').split(/\n\s*\n/).map(p=>'<p>'+safe(p).replace(/\n/g,'<br>')+'</p>').join('');root.className='';root.innerHTML='<div class="category">'+safe(data.category||'Travel guide')+'</div><h1>'+safe(data.title)+'</h1><div class="meta">By '+safe(data.author||'Safar Planner')+' · '+(data.read_time_min||5)+' min read · '+(data.published_at?new Date(data.published_at).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):'')+'</div>'+(data.cover_url?'<img class="cover" src="'+safe(data.cover_url)+'" alt="'+safe(data.title)+'">':'')+'<p class="excerpt">'+safe(data.excerpt)+'</p><article class="content">'+paragraphs+'</article>'}catch(e){root.textContent=e.message||'Could not load article.'}})();</script></body></html>
